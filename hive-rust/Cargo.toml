[package]
name = "hive"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "hive"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.28", default-features = false, features = ["default_fonts", "glow"] }
egui   = "0.28"
serde      = { version = "1",  features = ["derive"] }
serde_json = "1"
uuid       = { version = "1",  features = ["v4"] }
chrono     = "0.4"
dirs       = "5"
